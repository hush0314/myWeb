<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的第一個 RWD 網站</title>
    <style>
        /* 基礎樣式 */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
            color: #333;
            text-align: center;
        }
        header {
            background-color: #24292e;
            color: white;
            padding: 40px 20px;
        }
        .container {
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }
        .card-group {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            margin-top: 20px;
        }
        .card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin: 10px;
            padding: 20px;
            flex: 1 1 250px; /* 這行是 RWD 彈性排版的關鍵 */
        }
        footer {
            background-color: #24292e;
            color: #aaa;
            padding: 15px;
            position: fixed;
            bottom: 0;
            width: 100%;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <header>
        <h1>歡迎來到我的 AI 創建網站</h1>
        <p>這是一個具備響應式設計（RWD）的網頁</p>
    </header>

    <div class="container">
        <h2>今日學習心得</h2>
        <p>老師說在 AI 資訊爆炸的時代，要學會自己主動利用 AI 截圖發問、一步步解決問題！</p>
        
        <div class="card-group">
            <div class="card">
                <h3>📱 手機模式</h3>
                <p>當你在手機上看時，卡片會自動垂直單欄排列，方便閱讀。</p>
            </div>
            <div class="card">
                <h3>💻 電腦模式</h3>
                <p>當你在電腦大螢幕上看時，卡片會自動橫向並排，充分利用空間。</p>
            </div>
        </div>
    </div>

    <footer>
        使用 GitHub Pages 免費網頁託管服務
    </footer>

</body>
</html>
